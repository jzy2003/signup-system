
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>编辑报名信息</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:30px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:20px;
        }

        input{
            width:100%;
            height:45px;
            margin-top:10px;
            margin-bottom:20px;
            padding:0 10px;
            border:1px solid #ddd;
            border-radius:10px;
        }

        button{
            width:100%;
            height:50px;
            background:#4364F7;
            color:white;
            border:none;
            border-radius:12px;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>编辑报名信息</h2>

    <form method="POST">

        <input name="name" value="{{ user.name }}">

        <input name="phone" value="{{ user.phone }}">

        <input name="department" value="{{ user.department }}">

        <input name="grade" value="{{ user.grade }}">

        <input name="card_number" value="{{ user.card_number }}">

        <input name="partner_name" value="{{ user.partner_name }}">

        <input name="partner_phone" value="{{ user.partner_phone }}">

        <input name="partner_department" value="{{ user.partner_department }}">

        <input name="partner_grade" value="{{ user.partner_grade }}">

        <input name="partner_card_number" value="{{ user.partner_card_number }}">

        <button type="submit">
            保存修改
        </button>

    </form>

</div>

</body>
</html>
