<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>报名后台</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            padding:20px;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        th{
            background:#4364F7;
            color:white;
        }

    </style>

</head>

<body>

<h2>报名后台数据</h2>

<table>

<tr>

    <th>姓名</th>
    <th>手机号</th>
    <th>院系</th>
    <th>年级</th>
    <th>校友卡号</th>

    <th>搭档姓名</th>
    <th>搭档手机号</th>

    <th>晚宴</th>

</tr>

{% for user in users %}

<tr>

    <td>{{ user.name }}</td>
    <td>{{ user.phone }}</td>
    <td>{{ user.department }}</td>
    <td>{{ user.grade }}</td>
    <td>{{ user.card_number }}</td>

    <td>{{ user.partner_name }}</td>
    <td>{{ user.partner_phone }}</td>

    <td>{{ user.dinner }}</td>

</tr>

{% endfor %}

</table>

</body>

</html>
