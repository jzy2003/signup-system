<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>报名系统</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #07c160;
            color: white;
            border: none;
        }

        #partner-box {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <form method="POST">

        <select name="has_partner" onchange="togglePartner(this.value)">
            <option value="no">单人报名</option>
            <option value="yes">双人报名</option>
        </select>

        <!-- 本人 -->
        <input name="name">
        <input name="phone">
        <input name="department">
        <input name="grade">
        <input name="card_number">

        <!-- 搭档 -->
        <div id="partner-box">

            <input name="partner_name">
            <input name="partner_phone">
            <input name="partner_department">
            <input name="partner_grade">
            <input name="partner_card_number">

        </div>

        <!-- 晚宴 -->
        <select name="dinner">
            <option value="参加">参加</option>
            <option value="不参加">不参加</option>
        </select>

        <button type="submit">提交</button>

    </form>

</div>

<script>
function togglePartner(value){
    document.getElementById("partner-box").style.display =
        value === "yes" ? "block" : "none";
}
</script>

</body>
</html>
