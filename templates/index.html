
<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华科武汉校友长江天际杯第二届益智竞技赛</title>

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            padding:0;
            font-family:"Microsoft YaHei",sans-serif;
            background:linear-gradient(to bottom right,#eef4ff,#dbe9ff);
            min-height:100vh;
        }

        .container{
            width:90%;
            max-width:550px;
            margin:40px auto;
            background:white;
            padding:35px;
            border-radius:24px;
            box-shadow:0 8px 25px rgba(0,0,0,0.08);
        }

        h2{
            text-align:center;
            color:#1a2b6d;
            line-height:1.6;
            font-size:28px;
            margin-bottom:30px;
        }

        h3{
            color:#333;
            margin-top:30px;
            padding-left:10px;
            border-left:5px solid #4364F7;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:8px;
            color:#555;
            font-size:15px;
            font-weight:bold;
        }

        input,
        select{
            width:100%;
            height:50px;
            border:1px solid #dcdcdc;
            border-radius:14px;
            padding:0 15px;
            font-size:15px;
            outline:none;
            transition:0.2s;
            background:white;
        }

        input:focus,
        select:focus{
            border-color:#4364F7;
            box-shadow:0 0 0 4px rgba(67,100,247,0.15);
        }

        button{
            width:100%;
            height:52px;
            margin-top:35px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#0052D4,#4364F7,#6FB1FC);
            color:white;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
        }

        hr{
            border:none;
            border-top:1px solid #eee;
            margin:30px 0;
        }

        #partner-box{
            display:none;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>
        华科武汉校友长江天际杯<br>
        第二届益智竞技赛
    </h2>

    <form method="POST">

        <label>报名方式</label>

        <select name="has_partner" onchange="togglePartner(this.value)">
            <option value="no">单人报名</option>
            <option value="yes">双人报名</option>
        </select>

        <hr>

        <h3>本人信息</h3>

        <label>姓名</label>
        <input name="name" required>

        <label>手机号</label>
        <input name="phone" required>

        <label>本人在读时所属院系</label>
        <input name="department">

        <label>本人在读时所属年级</label>
        <input name="grade">

        <label>本人校友卡号</label>
        <input name="card_number">

        <hr>

        <h3>搭档信息</h3>

        <div id="partner-box">

            <label>搭档姓名</label>
            <input name="partner_name">

            <label>搭档手机号</label>
            <input name="partner_phone">

            <label>搭档在读时所属院系</label>
            <input name="partner_department">

            <label>搭档在读时所属年级</label>
            <input name="partner_grade">

            <label>搭档校友卡号</label>
            <input name="partner_card_number">

        </div>

        <button type="submit">
            提交报名
        </button>

    </form>

</div>

<script>

function togglePartner(value){

    document.getElementById("partner-box").style.display =
        value === "yes" ? "block" : "none";
}

</script>

</body>
</html>
