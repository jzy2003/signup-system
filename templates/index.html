<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>报名系统</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #07c160;
            color: white;
            border: none;
        }

        #partner-box {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>报名系统</h2>

    <form method="POST">

        <label>是否有搭档</label>
        <select name="has_partner" onchange="togglePartner(this.value)">
            <option value="no">单人报名</option>
            <option value="yes">双人报名</option>
        </select>

        <hr>

        <h3>本人信息</h3>

        <label>姓名</label>
        <input name="name">

        <label>手机号</label>
        <input name="phone">

        <label>院系</label>
        <input name="department">

        <label>年级</label>
        <input name="grade">

        <label>校友卡号</label>
        <input name="card_number">

        <hr>

        <h3>搭档信息</h3>

        <div id="partner-box">

            <label>搭档姓名</label>
            <input name="partner_name">

            <label>搭档手机号</label>
            <input name="partner_phone">

            <label>搭档院系</label>
            <input name="partner_department">

            <label>搭档年级</label>
            <input name="partner_grade">

            <label>搭档校友卡号</label>
            <input name="partner_card_number">

        </div>

        <hr>

        <label>是否参加晚宴</label>
        <select name="dinner">
            <option value="参加">参加</option>
            <option value="不参加">不参加</option>
        </select>

        <br><br>

        <button type="submit">提交报名</button>

    </form>

</div>

<script>
function togglePartner(value){
    document.getElementById("partner-box").style.display =
        value === "yes" ? "block" : "none";
}
</script>

</body>
</html>
